<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬可福音 RPG - 完整版</title>
    <style>
        :root {
            --bg-color: #222;
            --game-width: 800px;
            --game-height: 600px;
            --ui-border: #fff;
            --ui-bg: #000;
            --text-color: #fff;
            --highlight: #ffff55;
            --btn-bg: #333;
            --btn-hover: #555;
        }

        body {
            margin: 0; padding: 0;
            background-color: #111;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            font-family: 'PMingLiU', 'MingLiU', monospace;
            overflow: hidden; user-select: none;
            -webkit-font-smoothing: none;
        }

        /* --- 遊戲主容器 --- */
        #game-container {
            position: relative;
            width: var(--game-width); height: var(--game-height);
            background-color: #000;
            border: 4px solid #555;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 頂部功能列 --- */
        #top-bar {
            height: 40px;
            background: #000;
            border-bottom: 2px solid #555;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px;
            z-index: 200;
        }
        .ui-btn {
            background: var(--btn-bg); color: #fff; border: 1px solid #777;
            padding: 4px 10px; cursor: pointer; font-size: 14px; font-family: inherit;
        }
        .ui-btn:hover { background: var(--btn-hover); }
        .ui-btn.active { background: #006400; color: #0f0; border-color: #0f0; }

        /* --- 背景層 --- */
        #background-layer {
            position: absolute; top: 40px; left: 0; width: 100%; bottom: 0;
            z-index: 0; transition: background 0.5s;
        }
        /* 背景樣式 */
        .bg-dark { background: #000; }
        .bg-desert { background: linear-gradient(to bottom, #87CEEB, #d2b48c 60%); }
        .bg-river { background: linear-gradient(to bottom, #87CEEB, #2E8B57 50%, #4682B4 100%); }
        .bg-sea { background: linear-gradient(to bottom, #1E90FF, #000080 80%); }
        .bg-room { background: repeating-linear-gradient(90deg, #3e2723, #3e2723 20px, #281815 20px, #281815 40px); } /* 室內木紋 */
        .bg-holy { background: #fff; animation: holy-flash 2s ease-out forwards; }
        .bg-storm { background: #2c3e50; animation: storm 0.2s infinite; }
        .bg-cross { background: linear-gradient(to bottom, #330000, #000); } /* 各各他 */

        @keyframes holy-flash { 0% { background: #fff; } 100% { background: #fff; opacity: 0.5; } }
        @keyframes storm { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.2); } }

        /* --- 角色層 --- */
        #character-stage {
            position: absolute;
            top: 20%; left: 0; width: 100%; height: 200px;
            z-index: 10;
            display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none; /* 讓點擊穿透 */
            gap: 20px; /* 角色間距 */
        }

        /* 角色基礎與狀態 */
        .char-wrapper {
            transition: all 0.3s ease;
            transform-origin: bottom center;
            animation: breathe 3s ease-in-out infinite;
        }
        .char-dimmed {
            filter: brightness(0.4) grayscale(0.8);
            transform: scale(0.95);
            z-index: 0;
        }
        .char-active {
            filter: brightness(1.1);
            transform: scale(1.05);
            z-index: 10;
        }

        /* CSS 繪圖核心 */
        .char-base { position: relative; width: 64px; height: 90px; }
        .head { position: relative; width: 30px; height: 34px; margin: 0 auto; z-index: 2; border-radius: 4px 4px 0 0; }
        .body { position: relative; width: 44px; height: 56px; margin: -2px auto 0; z-index: 1; border-radius: 8px 8px 0 0; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .body::before, .body::after { content: ''; position: absolute; top: 15px; width: 8px; height: 22px; border-radius: 4px; background: inherit; filter: brightness(1.1); }
        .body::before { left: -6px; } .body::after { right: -6px; }

        /* 個別角色樣式 */
        /* 耶穌 */
        .c-jesus .head { background: #fbdcb6; box-shadow: -4px 0 0 #4e342e, 4px 0 0 #4e342e, 0 -4px 0 #4e342e; }
        .c-jesus .head::after { content: ''; position: absolute; bottom:0; width:100%; height:8px; background:#4e342e; }
        .c-jesus .body { background: linear-gradient(115deg, #f5f5f5 35%, #b71c1c 35%, #d32f2f 50%, #b71c1c 65%, #f5f5f5 65%); }
        .c-jesus .halo { position: absolute; top:-20px; left:50%; transform:translateX(-50%); width:60px; height:60px; border:2px solid #FFD700; border-radius:50%; background:rgba(255,215,0,0.1); z-index:-1; animation: glow 2s infinite; }
        
        /* 彼得/門徒 */
        .c-peter .head { background: #d9b99b; }
        .c-peter .head::before { content: ''; position: absolute; top:-6px; left:-4px; width:126%; height:14px; background:#1565c0; border-radius:4px 4px 0 0; z-index:5; }
        .c-peter .body { background: #1976d2; }

        /* 約翰 */
        .c-john .head { background: #d2b48c; box-shadow: 0 -5px 0 #3e2723; }
        .c-john .body { background: radial-gradient(#795548 15%, #5d4037 16%); background-size:4px 4px; }

        /* 法利賽人 */
        .c-pharisee .head { background: #e0e0e0; } 
        .c-pharisee .head::before { content: ''; position: absolute; top:-8px; left:-6px; width:140%; height:16px; background:#4a148c; border-radius:2px; z-index:5; }
        .c-pharisee .body { background: #6a1b9a; border-left: 4px solid #fff; border-right: 4px solid #fff; }

        /* 羅馬兵 */
        .c-soldier .head { background: #d9b99b; }
        .c-soldier .head::before { content: ''; position: absolute; top:-6px; width:100%; height:14px; background:#b71c1c; border-radius:4px 4px 0 0; }
        .c-soldier .body { background: #555; border: 2px solid #ffd700; }

        /* 互動動畫 */
        @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes glow { 50% { box-shadow: 0 0 20px #FFD700; } }

        /* --- 下方對話框 --- */
        #text-area {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            height: 160px;
            background: var(--ui-bg);
            border: 4px double var(--ui-border);
            border-radius: 6px;
            padding: 20px 30px;
            z-index: 100;
            display: flex; flex-direction: column;
            cursor: pointer;
        }
        #speaker-name {
            color: var(--highlight); font-size: 20px; font-weight: bold; margin-bottom: 10px;
            border: 1px solid #555; display: inline-block; width: fit-content; padding: 2px 8px; background: #222;
            display: none;
        }
        #dialogue-text { color: #fff; font-size: 22px; line-height: 1.6; flex-grow: 1; }
        .cursor-triangle { display: inline-block; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid white; animation: blink 1s infinite; visibility: hidden; }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- 選單介面 (Menu) --- */
        #menu-screen, #title-screen {
            position: absolute; top: 40px; left: 0; width: 100%; bottom: 0;
            background: #111; z-index: 300;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #menu-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            padding: 20px; background: #222; border: 2px solid #555;
        }
        .chapter-btn {
            width: 80px; height: 60px; background: #444; border: 2px solid #fff; color: #fff;
            font-family: inherit; font-size: 18px; cursor: pointer;
        }
        .chapter-btn:disabled { background: #222; color: #555; border-color: #555; cursor: not-allowed; }
        .chapter-btn:hover:not(:disabled) { background: #666; transform: scale(1.05); }
        
        #title-screen h1 { font-size: 48px; color: var(--highlight); text-shadow: 4px 4px #000; margin-bottom: 20px; text-align: center; }
        #title-screen h2 { font-size: 28px; color: #fff; margin-bottom: 50px; }

        /* 響應式 */
        @media (max-width: 600px) {
            #game-container { width: 100%; height: 100%; border: none; }
            #character-stage { top: 15%; transform: scale(0.8); width: 120%; left: -10%; }
            #menu-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .chapter-btn { width: 70px; height: 50px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 頂部功能列 -->
    <div id="top-bar">
        <button class="ui-btn" onclick="Game.prevLine()">&#9664; 上一句</button>
        <button class="ui-btn" onclick="Game.confirmMenu()">&#9776; 目錄</button>
        <button class="ui-btn" id="btn-auto" onclick="Game.toggleAuto()">自動播放 &#9654;</button>
    </div>

    <!-- 遊戲層 -->
    <div id="background-layer" class="bg-dark"></div>
    
    <div id="character-stage">
        <!-- 角色由 JS 注入 -->
    </div>

    <div id="text-area" onclick="Game.nextLine()">
        <div id="speaker-name"></div>
        <div>
            <span id="dialogue-text"></span>
            <div class="cursor-triangle" id="cursor"></div>
        </div>
    </div>

    <!-- 章節選單 -->
    <div id="menu-screen">
        <h1 style="color:white; margin-bottom:20px;">馬可福音 - 章節選擇</h1>
        <div id="menu-grid"></div>
    </div>

    <!-- 章節標題頁 -->
    <div id="title-screen" style="display:none;">
        <h1 id="chapter-title-text"></h1>
        <h2 id="chapter-subtitle"></h2>
        <button class="ui-btn" style="font-size:24px; padding: 10px 30px;" onclick="Game.startChapter()">開始閱讀</button>
    </div>
</div>

<script>

// --- 遊戲引擎 (Game Engine) ---

const Game = {
    state: {
        chapter: 1,
        line: 0,
        auto: false,
        typing: false,
        timer: null,
        maxChapter: 1
    },
    
    dom: {
        bg: document.getElementById('background-layer'),
        stage: document.getElementById('character-stage'),
        textArea: document.getElementById('text-area'),
        speaker: document.getElementById('speaker-name'),
        text: document.getElementById('dialogue-text'),
        cursor: document.getElementById('cursor'),
        menu: document.getElementById('menu-screen'),
        titleScreen: document.getElementById('title-screen'),
        titleText: document.getElementById('chapter-title-text'),
        subtitle: document.getElementById('chapter-subtitle'),
        menuGrid: document.getElementById('menu-grid'),
        btnAuto: document.getElementById('btn-auto')
    },

    audio: null,

    init: function() {
        // 讀取存檔
        const saved = localStorage.getItem('markRPG_progress');
        if (saved) this.state.maxChapter = parseInt(saved);
        
        this.initAudio();
        this.renderMenu();
    },

    initAudio: function() {
        if(!this.audio) {
            this.audio = new (window.AudioContext || window.webkitAudioContext)();
        }
    },

    playTone: function(type) {
        if(!this.audio || this.audio.state === 'suspended') this.audio.resume();
        const osc = this.audio.createOscillator();
        const gain = this.audio.createGain();
        
        if(type === 'type') { // 打字
            osc.type = 'square'; osc.frequency.value = 400 + Math.random()*100;
            gain.gain.value = 0.05;
            osc.start(); osc.stop(this.audio.currentTime + 0.05);
        } else if(type === 'next') { // 換頁
            osc.type = 'triangle'; osc.frequency.value = 150;
            gain.gain.value = 0.1;
            osc.start(); osc.stop(this.audio.currentTime + 0.1);
        } else if(type === 'holy') { // 神聖
            osc.type = 'sine'; osc.frequency.setValueAtTime(200, this.audio.currentTime);
            osc.frequency.linearRampToValueAtTime(600, this.audio.currentTime + 1);
            gain.gain.value = 0.1;
            osc.start(); osc.stop(this.audio.currentTime + 1.5);
        }
        
        osc.connect(gain); gain.connect(this.audio.destination);
    },

    // --- 選單邏輯 ---
    renderMenu: function() {
        this.dom.menu.style.display = 'flex';
        this.dom.titleScreen.style.display = 'none';
        this.dom.menuGrid.innerHTML = '';

        for(let i=1; i<=16; i++) {
            const btn = document.createElement('button');
            btn.className = 'chapter-btn';
            btn.innerText = i;
            if(i > this.state.maxChapter) {
                btn.disabled = true;
            } else {
                btn.onclick = () => this.showTitleScreen(i);
            }
            this.dom.menuGrid.appendChild(btn);
        }
    },

    confirmMenu: function() {
        if(confirm("確定要回到目錄選單嗎？")) {
            this.stopAuto();
            this.renderMenu();
        }
    },

    showTitleScreen: function(chIndex) {
        this.state.chapter = chIndex;
        this.state.line = 0;
        this.dom.menu.style.display = 'none';
        this.dom.titleScreen.style.display = 'flex';
        
        const chData = scriptData[chIndex];
        this.dom.titleText.innerText = chData.title;
        this.dom.subtitle.innerText = chData.subtitle;
    },

    startChapter: function() {
        this.dom.titleScreen.style.display = 'none';
        this.playTone('next');
        this.loadLine();
    },

    // --- 遊戲主迴圈 ---
    loadLine: function() {
        const chData = scriptData[this.state.chapter];
        if(!chData || this.state.line >= chData.scenes.length) {
            this.finishChapter();
            return;
        }

        const scene = chData.scenes[this.state.line];

        // 1. 背景
        if(scene.bg) this.dom.bg.className = scene.bg;

        // 2. 角色渲染 (Multi-character)
        this.renderCharacters(scene.chars || [], scene.focus);

        // 3. 對話框
        this.dom.text.innerText = '';
        this.dom.cursor.style.visibility = 'hidden';
        if(scene.type === 'talk') {
            this.dom.speaker.innerText = scene.name;
            this.dom.speaker.style.display = 'inline-block';
        } else {
            this.dom.speaker.style.display = 'none';
        }

        // 4. 音效
        if(scene.sound === 'holy') this.playTone('holy');

        // 5. 打字機
        this.state.typing = true;
        let charIdx = 0;
        if(this.state.timer) clearInterval(this.state.timer);

        this.state.timer = setInterval(() => {
            this.dom.text.innerText += scene.text[charIdx];
            if(charIdx % 2 === 0) this.playTone('type');
            charIdx++;
            if(charIdx >= scene.text.length) {
                this.finishTyping();
            }
        }, 50);
    },

    renderCharacters: function(charList, focusId) {
        this.dom.stage.innerHTML = ''; // 清空
        
        charList.forEach(charId => {
            const wrapper = document.createElement('div');
            wrapper.className = 'char-wrapper';
            
            // 判斷是否有焦點 (Dim others)
            if(focusId && charId !== focusId) {
                wrapper.classList.add('char-dimmed');
            } else if(focusId && charId === focusId) {
                wrapper.classList.add('char-active');
            }

            // 建立內部 HTML
            const base = document.createElement('div');
            base.className = 'char-base c-' + charId;

            // Halo logic for Jesus
            if(charId === 'jesus') {
                const halo = document.createElement('div'); halo.className='halo';
                base.appendChild(halo);
            }

            const head = document.createElement('div'); head.className = 'head';
            const body = document.createElement('div'); body.className = 'body';
            
            base.appendChild(head);
            base.appendChild(body);
            wrapper.appendChild(base);
            this.dom.stage.appendChild(wrapper);
        });
    },

    finishTyping: function() {
        clearInterval(this.state.timer);
        this.state.typing = false;
        const scene = scriptData[this.state.chapter].scenes[this.state.line];
        this.dom.text.innerText = scene.text;
        this.dom.cursor.style.visibility = 'visible';

        if(this.state.auto) {
            const delay = 1500 + (scene.text.length * 80);
            this.state.timer = setTimeout(() => this.nextLine(), delay);
        }
    },

    nextLine: function() {
        if(this.state.typing) {
            this.finishTyping();
            return;
        }
        
        // 檢查是否還有下一句
        const chData = scriptData[this.state.chapter];
        if(this.state.line < chData.scenes.length - 1) {
            this.state.line++;
            this.playTone('next');
            this.loadLine();
        } else {
            this.finishChapter();
        }
    },

    prevLine: function() {
        if(this.state.line > 0) {
            this.state.line--;
            this.playTone('next');
            this.loadLine();
        }
    },

    finishChapter: function() {
        this.stopAuto();
        
        // 更新進度
        if(this.state.chapter >= this.state.maxChapter && this.state.chapter < 16) {
            this.state.maxChapter = this.state.chapter + 1;
            localStorage.setItem('markRPG_progress', this.state.maxChapter);
        }

        if(this.state.chapter < 16) {
            if(confirm("本章結束。要進入下一章嗎？")) {
                this.showTitleScreen(this.state.chapter + 1);
            } else {
                this.renderMenu();
            }
        } else {
            alert("全書完。願主賜福這段閱讀的時光。");
            this.renderMenu();
        }
    },

    toggleAuto: function() {
        this.state.auto = !this.state.auto;
        this.dom.btnAuto.innerText = this.state.auto ? "自動播放 ⏸" : "自動播放 ▶";
        this.dom.btnAuto.classList.toggle('active', this.state.auto);
        
        if(this.state.auto && !this.state.typing) {
            this.nextLine();
        } else {
            clearTimeout(this.state.timer);
        }
    },

    stopAuto: function() {
        this.state.auto = false;
        this.dom.btnAuto.innerText = "自動播放 ▶";
        this.dom.btnAuto.classList.remove('active');
        clearTimeout(this.state.timer);
    }
};

// 啟動
window.onload = () => Game.init();

// 鍵盤輔助
document.addEventListener('keydown', (e) => {
    if(document.getElementById('menu-screen').style.display !== 'none') return;
    
    if(e.code === 'Space' || e.code === 'Enter') Game.nextLine();
    if(e.code === 'Backspace') Game.prevLine();
});

</script>
