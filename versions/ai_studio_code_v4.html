<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬可福音 RPG - 完整全書版</title>
    <style>
        :root {
            --bg-color: #222;
            --game-width: 800px;
            --game-height: 600px;
            --ui-border: #fff;
            --ui-bg: #000;
            --text-color: #fff;
            --highlight: #ffff55;
            --btn-bg: #333;
            --btn-hover: #555;
        }

        body {
            margin: 0; padding: 0;
            background-color: #111;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            font-family: 'PMingLiU', 'MingLiU', monospace;
            overflow: hidden; user-select: none;
            -webkit-font-smoothing: none;
        }

        #game-container {
            position: relative;
            width: var(--game-width); height: var(--game-height);
            background-color: #000;
            border: 4px solid #555;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 頂部功能列 --- */
        #top-bar {
            height: 40px; background: #000; border-bottom: 2px solid #555;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; z-index: 200;
        }
        .ui-btn {
            background: var(--btn-bg); color: #fff; border: 1px solid #777;
            padding: 4px 10px; cursor: pointer; font-size: 14px; font-family: inherit;
        }
        .ui-btn:hover { background: var(--btn-hover); }
        .ui-btn.active { background: #006400; color: #0f0; border-color: #0f0; }

        /* --- 背景與角色 --- */
        #background-layer {
            position: absolute; top: 40px; left: 0; width: 100%; bottom: 0;
            z-index: 0; transition: background 0.5s;
        }
        .bg-dark { background: #000; }
        .bg-desert { background: linear-gradient(to bottom, #87CEEB, #d2b48c 60%); }
        .bg-river { background: linear-gradient(to bottom, #87CEEB, #2E8B57 50%, #4682B4 100%); }
        .bg-sea { background: linear-gradient(to bottom, #1E90FF, #000080 80%); }
        .bg-room { background: repeating-linear-gradient(90deg, #3e2723, #3e2723 20px, #281815 20px, #281815 40px); }
        .bg-holy { background: #fff; animation: holy-flash 2s ease-out forwards; }
        .bg-storm { background: #2c3e50; animation: storm 0.2s infinite; }
        .bg-cross { background: linear-gradient(to bottom, #330000, #000); }
        .bg-garden { background: linear-gradient(to bottom, #001f3f, #003300); } /* 客西馬尼 */

        @keyframes holy-flash { 0% { background: #fff; } 100% { background: #fff; opacity: 0.5; } }
        @keyframes storm { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.2); } }

        #character-stage {
            position: absolute; top: 20%; left: 0; width: 100%; height: 200px;
            z-index: 10; display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none; gap: 20px;
        }

        /* 角色樣式 (與之前相同) */
        .char-wrapper { transition: all 0.3s ease; transform-origin: bottom center; animation: breathe 3s ease-in-out infinite; }
        .char-dimmed { filter: brightness(0.4) grayscale(0.8); transform: scale(0.95); z-index: 0; }
        .char-active { filter: brightness(1.1); transform: scale(1.05); z-index: 10; }
        .char-base { position: relative; width: 64px; height: 90px; }
        .head { position: relative; width: 30px; height: 34px; margin: 0 auto; z-index: 2; border-radius: 4px 4px 0 0; }
        .body { position: relative; width: 44px; height: 56px; margin: -2px auto 0; z-index: 1; border-radius: 8px 8px 0 0; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .body::before, .body::after { content: ''; position: absolute; top: 15px; width: 8px; height: 22px; border-radius: 4px; background: inherit; }
        .body::before { left: -6px; } .body::after { right: -6px; }
        
        /* Jesus */
        .c-jesus .head { background: #fbdcb6; box-shadow: -4px 0 0 #4e342e, 4px 0 0 #4e342e, 0 -4px 0 #4e342e; }
        .c-jesus .head::after { content: ''; position: absolute; bottom:0; width:100%; height:8px; background:#4e342e; }
        .c-jesus .body { background: linear-gradient(115deg, #f5f5f5 35%, #b71c1c 35%, #d32f2f 50%, #b71c1c 65%, #f5f5f5 65%); }
        .c-jesus .halo { position: absolute; top:-20px; left:50%; transform:translateX(-50%); width:60px; height:60px; border:2px solid #FFD700; border-radius:50%; background:rgba(255,215,0,0.1); z-index:-1; animation: glow 2s infinite; }
        /* John */
        .c-john .head { background: #d2b48c; box-shadow: 0 -5px 0 #3e2723; }
        .c-john .body { background: radial-gradient(#795548 15%, #5d4037 16%); background-size:4px 4px; }
        /* Peter */
        .c-peter .head { background: #d9b99b; }
        .c-peter .head::before { content: ''; position: absolute; top:-6px; left:-4px; width:126%; height:14px; background:#1565c0; border-radius:4px 4px 0 0; z-index:5; }
        .c-peter .body { background: #1976d2; }
        /* Others */
        .c-pharisee .head { background: #e0e0e0; } .c-pharisee .head::before { content: ''; position: absolute; top:-8px; left:-6px; width:140%; height:16px; background:#4a148c; } .c-pharisee .body { background: #6a1b9a; border-left: 4px solid #fff; border-right: 4px solid #fff; }
        .c-crowd .head { background: #d9b99b; } .c-crowd .body { background: #7f8c8d; }
        .c-soldier .head { background: #d9b99b; } .c-soldier .head::before { content: ''; position: absolute; top:-6px; width:100%; height:14px; background:#b71c1c; } .c-soldier .body { background: #555; border: 2px solid #ffd700; }
        
        @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes glow { 50% { box-shadow: 0 0 20px #FFD700; } }

        /* --- 對話框 --- */
        #text-area {
            position: absolute; bottom: 20px; left: 20px; right: 20px; height: 160px;
            background: var(--ui-bg); border: 4px double var(--ui-border); border-radius: 6px;
            padding: 20px 30px; z-index: 100; display: flex; flex-direction: column; cursor: pointer;
        }
        #speaker-name {
            color: var(--highlight); font-size: 20px; font-weight: bold; margin-bottom: 10px;
            border: 1px solid #555; display: inline-block; width: fit-content; padding: 2px 8px; background: #222; display: none;
        }
        #dialogue-text { color: #fff; font-size: 22px; line-height: 1.6; flex-grow: 1; }
        .cursor-triangle { display: inline-block; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid white; animation: blink 1s infinite; visibility: hidden; }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- UI: 目錄與標題 --- */
        #menu-screen, #title-screen {
            position: absolute; top: 40px; left: 0; width: 100%; bottom: 0;
            background: #111; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; background: #222; border: 2px solid #555; }
        .chapter-btn {
            position: relative; width: 80px; height: 60px; background: #444; border: 2px solid #fff; color: #fff;
            font-family: inherit; font-size: 18px; cursor: pointer;
        }
        .chapter-btn:hover { background: #666; transform: scale(1.05); }
        .last-read-marker {
            position: absolute; top: -8px; right: -8px; background: #b00; color: #fff; 
            font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #fff;
            box-shadow: 2px 2px 0 #000;
        }

        /* --- RPG 風格提示窗 (Custom Modal) --- */
        #rpg-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 999;
            display: none; align-items: center; justify-content: center;
        }
        .modal-box {
            width: 400px; background: #000; border: 4px double #fff; padding: 20px;
            text-align: center; color: #fff; box-shadow: 0 0 20px #000;
        }
        .modal-text { font-size: 20px; margin-bottom: 30px; line-height: 1.5; }
        .modal-actions { display: flex; justify-content: center; gap: 20px; }
        .modal-btn {
            background: #333; color: #fff; border: 2px solid #fff; padding: 8px 20px;
            font-family: inherit; font-size: 18px; cursor: pointer;
        }
        .modal-btn:hover { background: #555; color: #ff0; }

        @media (max-width: 600px) {
            #game-container { width: 100%; height: 100%; border: none; }
            #character-stage { top: 15%; transform: scale(0.8); width: 120%; left: -10%; }
            #menu-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .modal-box { width: 80%; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 頂部功能列 -->
    <div id="top-bar">
        <button class="ui-btn" onclick="Game.prevLine()">&#9664; 上一句</button>
        <button class="ui-btn" onclick="Game.requestMenu()">&#9776; 目錄</button>
        <button class="ui-btn" id="btn-auto" onclick="Game.toggleAuto()">自動播放 &#9654;</button>
    </div>

    <!-- 遊戲層 -->
    <div id="background-layer" class="bg-dark"></div>
    <div id="character-stage"></div>
    
    <div id="text-area" onclick="Game.nextLine()">
        <div id="speaker-name"></div>
        <div><span id="dialogue-text"></span><div class="cursor-triangle" id="cursor"></div></div>
    </div>

    <!-- 選單與標題 -->
    <div id="menu-screen">
        <h1 style="color:white; margin-bottom:20px;">馬可福音 RPG</h1>
        <p style="color:#aaa; margin-bottom:10px;">選擇章節閱讀</p>
        <div id="menu-grid"></div>
    </div>

    <div id="title-screen" style="display:none;">
        <h1 id="chapter-title-text" style="font-size:48px; color:#ffff55; text-align:center; margin-bottom:20px;"></h1>
        <h2 id="chapter-subtitle" style="font-size:24px; color:#fff; margin-bottom:50px;"></h2>
        <button class="ui-btn" style="font-size:24px; padding: 10px 30px;" onclick="Game.startChapter()">開始閱讀</button>
    </div>

    <!-- RPG 風格彈窗 -->
    <div id="rpg-modal">
        <div class="modal-box">
            <div class="modal-text" id="modal-msg"></div>
            <div class="modal-actions" id="modal-btns"></div>
        </div>
    </div>
</div>

<script>
/* --- 腳本資料 (16 章完整骨架) --- */
const scriptData = [
    null, 
    // Ch 1
    {
        title: "第 1 章", subtitle: "預備道路與呼召",
        scenes: [
            { type: 'narr', text: '神的兒子，耶穌基督福音的起頭。', bg: 'bg-dark' },
            { type: 'talk', name: '施洗約翰', text: '「我是用水給你們施洗，他卻要用聖靈給你們施洗。」', chars: ['john'], focus: 'john', bg: 'bg-desert' },
            { type: 'narr', text: '耶穌受了洗，聖靈彷彿鴿子降在他身上。', chars: ['john', 'jesus'], focus: 'jesus', bg: 'bg-river', sound: 'holy' },
            { type: 'talk', name: '天上的聲音', text: '「你是我的愛子，我喜悅你。」', bg: 'bg-holy', chars: ['jesus'], focus: 'jesus' },
            { type: 'talk', name: '耶穌', text: '「日期滿了，神的國近了。你們當悔改，信福音！」', bg: 'bg-sea', chars: ['jesus'], focus: 'jesus' },
            { type: 'talk', name: '耶穌', text: '「來跟從我，我要叫你們得人如得魚一樣。」', chars: ['jesus', 'peter'], focus: 'jesus' },
            { type: 'narr', text: '他們就立刻捨了網，跟從了他。', focus: 'peter' }
        ]
    },
    // Ch 2
    {
        title: "第 2 章", subtitle: "醫治癱子",
        scenes: [
            { type: 'narr', text: '有人帶著一個癱子來見耶穌，因為人多，就拆了房頂縋下來。', bg: 'bg-room', chars: ['jesus', 'crowd'] },
            { type: 'talk', name: '耶穌', text: '「小子，你的罪赦了。」', focus: 'jesus' },
            { type: 'talk', name: '文士', text: '（心裡議論）除了神以外，誰能赦罪呢？', chars: ['jesus', 'pharisee'], focus: 'pharisee' },
            { type: 'talk', name: '耶穌', text: '「我吩咐你，起來！拿你的褥子回家去吧。」', focus: 'jesus' },
            { type: 'narr', text: '那人就起來，立刻拿著褥子當眾人面前出去了。', chars: ['jesus'] }
        ]
    },
    // Ch 3
    {
        title: "第 3 章", subtitle: "設立十二使徒",
        scenes: [
            { type: 'narr', text: '耶穌在安息日治好了一隻手枯乾的人。', bg: 'bg-room', chars: ['jesus', 'pharisee'] },
            { type: 'narr', text: '法利賽人出去，商議怎樣可以除滅耶穌。', focus: 'pharisee' },
            { type: 'narr', text: '耶穌上了山，隨自己的意思叫人來，設立十二個人，要他們常和自己同在。', bg: 'bg-desert', chars: ['jesus', 'peter', 'john'] },
            { type: 'narr', text: '這十二人有西門彼得、雅各、約翰... 等人，耶穌賜給他們權柄趕鬼。' }
        ]
    },
    // Ch 4
    {
        title: "第 4 章", subtitle: "平靜風和海",
        scenes: [
            { type: 'talk', name: '耶穌', text: '「有落在好土裡的，就發生長大，結實有三十倍的，有六十倍的。」', bg: 'bg-sea', chars: ['jesus', 'crowd'], focus: 'jesus' },
            { type: 'narr', text: '當天晚上，他們要渡到那邊去，忽然起了暴風。', bg: 'bg-storm', chars: ['jesus', 'peter'] },
            { type: 'talk', name: '門徒', text: '「夫子！我們喪命，你不顧嗎？」', focus: 'peter' },
            { type: 'talk', name: '耶穌', text: '「住口！靜了吧！」', focus: 'jesus' },
            { type: 'narr', text: '風就止住，大大地平靜了。', bg: 'bg-sea' }
        ]
    },
    // Ch 5 (Added)
    {
        title: "第 5 章", subtitle: "格拉森與睚魯的女兒",
        scenes: [
            { type: 'narr', text: '他們來到海那邊格拉森人的地方。有一個被污鬼附著的人從墳塋裡出來迎著他。', bg: 'bg-dark', chars: ['jesus', 'crowd'] },
            { type: 'talk', name: '鬼附者', text: '「至高神的兒子耶穌，我與你有什麼相干？求你不要叫我受苦！」', focus: 'crowd' },
            { type: 'talk', name: '耶穌', text: '「污鬼，從這人身上出來吧！」', focus: 'jesus', sound: 'holy' },
            { type: 'narr', text: '那群鬼就出來，進入豬群，投在海裡淹死了。', bg: 'bg-sea', chars: ['jesus'] },
            { type: 'narr', text: '後來，管會堂的睚魯來求耶穌去救他的女兒。', bg: 'bg-room', chars: ['jesus', 'pharisee'] },
            { type: 'narr', text: '眾人都說那女孩死了，耶穌卻進去拉著孩子的手。', chars: ['jesus'] },
            { type: 'talk', name: '耶穌', text: '「大利大，古米！（閨女，我吩咐你起來！）」', focus: 'jesus' },
            { type: 'narr', text: '那閨女立時起來走。', sound: 'holy' }
        ]
    },
    // Ch 6 (Added)
    {
        title: "第 6 章", subtitle: "五餅二魚與水上行走",
        scenes: [
            { type: 'narr', text: '耶穌在曠野看見許多人，就憐憫他們，如同羊沒有牧人一般。', bg: 'bg-desert', chars: ['jesus', 'crowd'] },
            { type: 'talk', name: '門徒', text: '「這裡是野地，天已經晚了，請叫眾人散開買吃的吧。」', focus: 'crowd' },
            { type: 'talk', name: '耶穌', text: '「你們給他們吃吧。」', focus: 'jesus' },
            { type: 'narr', text: '耶穌拿著五個餅兩條魚，望著天祝福，擘開餅。眾人都吃，並且吃飽了。', sound: 'holy' },
            { type: 'narr', text: '晚上，門徒在海中划船，因風不順，搖櫓甚苦。', bg: 'bg-storm', chars: ['peter'] },
            { type: 'narr', text: '夜裡四更天，耶穌在海面上走，往他們那裡去。', chars: ['peter', 'jesus'], focus: 'jesus' },
            { type: 'talk', name: '門徒', text: '「是個鬼怪！」（他們驚慌喊叫）', focus: 'peter' },
            { type: 'talk', name: '耶穌', text: '「你們放心！是我，不要怕！」', focus: 'jesus' }
        ]
    },
    // Ch 7 (Added)
    {
        title: "第 7 章", subtitle: "心裡的潔淨",
        scenes: [
            { type: 'talk', name: '法利賽人', text: '「你的門徒吃飯不洗手，為什麼不遵守古人的遺傳呢？」', bg: 'bg-room', chars: ['jesus', 'pharisee'], focus: 'pharisee' },
            { type: 'talk', name: '耶穌', text: '「你們是離棄神的誡命，拘守人的遺傳。」', focus: 'jesus' },
            { type: 'talk', name: '耶穌', text: '「從外面進去的不能污穢人，惟有從裡面出來的乃能污穢人。」', focus: 'jesus' },
            { type: 'narr', text: '因為從人心裡發出惡念、苟合、偷盜、兇殺，這都是從裡面出來的。' }
        ]
    },
    // Ch 8 (Added)
    {
        title: "第 8 章", subtitle: "彼得認主",
        scenes: [
            { type: 'narr', text: '耶穌到了該撒利亞腓立比的村莊，在路上問門徒。', bg: 'bg-desert', chars: ['jesus', 'peter'] },
            { type: 'talk', name: '耶穌', text: '「人說我是誰？」', focus: 'jesus' },
            { type: 'talk', name: '門徒', text: '「有人說是施洗約翰，有人說是以利亞。」', focus: 'peter' },
            { type: 'talk', name: '耶穌', text: '「你們說我是誰？」', focus: 'jesus' },
            { type: 'talk', name: '彼得', text: '「你是基督。」', focus: 'peter' },
            { type: 'narr', text: '耶穌從此教訓他們，人子必須受許多苦，被殺，過三天復活。' }
        ]
    },
    // Ch 9 (Added)
    {
        title: "第 9 章", subtitle: "登山變像",
        scenes: [
            { type: 'narr', text: '耶穌帶著彼得、雅各、約翰暗暗的上了高山。', bg: 'bg-holy', chars: ['jesus', 'peter', 'john'] },
            { type: 'narr', text: '耶穌在他們面前變了形象，衣服放光，極其潔白。', focus: 'jesus', sound: 'holy' },
            { type: 'narr', text: '忽然有摩西、以利亞顯現，同耶穌說話。', chars: ['jesus'] },
            { type: 'talk', name: '雲裡的聲音', text: '「這是我的愛子，你們要聽他。」', focus: 'jesus', sound: 'holy' },
            { type: 'narr', text: '眾人往周圍一看，不再見一人，只見耶穌同他們在那裡。', bg: 'bg-desert', chars: ['jesus', 'peter', 'john'] }
        ]
    },
    // Ch 10 (Added)
    {
        title: "第 10 章", subtitle: "誰為大",
        scenes: [
            { type: 'narr', text: '有一個人跑來，跪在耶穌面前。', bg: 'bg-desert', chars: ['jesus', 'pharisee'] },
            { type: 'talk', name: '少年官', text: '「良善的夫子，我當做什麼事才可以承受永生？」', focus: 'pharisee' },
            { type: 'talk', name: '耶穌', text: '「去變賣你所有的，分給窮人，你還要來跟從我。」', focus: 'jesus' },
            { type: 'narr', text: '那人聽見這話，臉上就變了色，憂憂愁愁的走了，因為他的產業很多。', focus: 'pharisee' },
            { type: 'talk', name: '耶穌', text: '「駱駝穿過針的眼，比財主進神的國還容易呢。」', focus: 'jesus' },
            { type: 'talk', name: '耶穌', text: '「誰願為首，就必作眾人的僕人。因為人子來，不是要受人的服事，乃是要服事人。」', focus: 'jesus' }
        ]
    },
    // Ch 11 (Added)
    {
        title: "第 11 章", subtitle: "榮入聖城",
        scenes: [
            { type: 'narr', text: '耶穌騎著驢駒進入耶路撒冷。許多人把衣服鋪在路上。', bg: 'bg-room', chars: ['jesus', 'crowd'] },
            { type: 'talk', name: '眾人', text: '「和散那！奉主名來的是應當稱頌的！」', focus: 'crowd', sound: 'holy' },
            { type: 'narr', text: '耶穌進了聖殿，趕出殿裡做買賣的人，推倒兌換銀錢之人的桌子。', chars: ['jesus'] },

    {

            { type: 'talk', name: '耶穌', text: '「阿爸！父啊！求你叫這杯離開我。然而，不要從我的意思，只要從你的意思。」', focus: 'jesus' },
            { type: 'narr', text: '說話之間，猶大來了，那一夥人拿著刀棒拿住耶穌。', bg: 'bg-dark', chars: ['jesus', 'soldier'] }

    {

            { type: 'talk', name: '天使', text: '「不要驚恐！耶穌已經復活了，不在這裡。」', focus: 'john', sound: 'holy' },

/* --- 遊戲引擎 --- */
const Game = {
    state: { chapter: 1, line: 0, auto: false, typing: false, timer: null, lastRead: 1 },
    dom: {
        bg: document.getElementById('background-layer'),
        stage: document.getElementById('character-stage'),
        speaker: document.getElementById('speaker-name'),
        text: document.getElementById('dialogue-text'),
        cursor: document.getElementById('cursor'),
        menu: document.getElementById('menu-screen'),
        titleScreen: document.getElementById('title-screen'),
        titleText: document.getElementById('chapter-title-text'),
        subtitle: document.getElementById('chapter-subtitle'),
        menuGrid: document.getElementById('menu-grid'),
        btnAuto: document.getElementById('btn-auto'),
        modal: document.getElementById('rpg-modal'),
        modalMsg: document.getElementById('modal-msg'),
        modalBtns: document.getElementById('modal-btns')
    },
    audio: null,

    init: function() {
        const saved = localStorage.getItem('markRPG_lastRead');
        if (saved) this.state.lastRead = parseInt(saved);
        
        if(!this.audio) this.audio = new (window.AudioContext || window.webkitAudioContext)();
        this.renderMenu();
    },

    playTone: function(type) {
        if(this.audio && this.audio.state === 'suspended') this.audio.resume();
        if(!this.audio) return;
        
        const osc = this.audio.createOscillator();
        const gain = this.audio.createGain();
        if(type === 'type') { osc.type='square'; osc.frequency.value=400+Math.random()*100; gain.gain.value=0.05; osc.start(); osc.stop(this.audio.currentTime+0.05); }
        else if(type === 'next') { osc.type='triangle'; osc.frequency.value=150; gain.gain.value=0.1; osc.start(); osc.stop(this.audio.currentTime+0.1); }
        else if(type === 'holy') { osc.type='sine'; osc.frequency.setValueAtTime(200,this.audio.currentTime); osc.frequency.linearRampToValueAtTime(600,this.audio.currentTime+1); gain.gain.value=0.1; osc.start(); osc.stop(this.audio.currentTime+1.5); }
        osc.connect(gain); gain.connect(this.audio.destination);
    },

    /* --- RPG Modal System --- */
    showModal: function(text, type, onConfirm) {
        this.stopAuto();
        this.dom.modalMsg.innerHTML = text;
        this.dom.modalBtns.innerHTML = '';
        this.dom.modal.style.display = 'flex';

        if(type === 'confirm') {
            const btnYes = document.createElement('button'); btnYes.className = 'modal-btn'; btnYes.innerText = '確定';
            const btnNo = document.createElement('button'); btnNo.className = 'modal-btn'; btnNo.innerText = '取消';
            btnYes.onclick = () => { this.closeModal(); if(onConfirm) onConfirm(); };
            btnNo.onclick = () => { this.closeModal(); };
            this.dom.modalBtns.appendChild(btnYes); this.dom.modalBtns.appendChild(btnNo);
        } else {
            const btnOk = document.createElement('button'); btnOk.className = 'modal-btn'; btnOk.innerText = '確定';
            btnOk.onclick = () => this.closeModal();
            this.dom.modalBtns.appendChild(btnOk);
        }
    },
    closeModal: function() { this.dom.modal.style.display = 'none'; },

    /* --- Menu Logic --- */
    renderMenu: function() {
        this.dom.menu.style.display = 'flex';
        this.dom.titleScreen.style.display = 'none';
        this.dom.menuGrid.innerHTML = '';

        for(let i=1; i<=16; i++) {
            const btn = document.createElement('button');
            btn.className = 'chapter-btn';
            btn.innerText = i;
            btn.onclick = () => this.showTitleScreen(i);

            // 進度標記
            if(i === this.state.lastRead) {
                const marker = document.createElement('div');
                marker.className = 'last-read-marker';
                marker.innerText = '🔖';
                btn.appendChild(marker);
                btn.style.borderColor = '#ffff55';
            }
            this.dom.menuGrid.appendChild(btn);
        }
    },

    requestMenu: function() {
        this.showModal("確定要中斷閱讀並回到目錄嗎？", "confirm", () => {
            this.renderMenu();
        });
    },

    showTitleScreen: function(chIndex) {
        this.state.chapter = chIndex;
        this.state.line = 0;
        this.dom.menu.style.display = 'none';
        this.dom.titleScreen.style.display = 'flex';
        this.dom.titleText.innerText = scriptData[chIndex].title;
        this.dom.subtitle.innerText = scriptData[chIndex].subtitle;
    },

    startChapter: function() {
        this.dom.titleScreen.style.display = 'none';
        this.playTone('next');
        this.saveProgress();
        this.loadLine();
    },

    saveProgress: function() {
        this.state.lastRead = this.state.chapter;
        localStorage.setItem('markRPG_lastRead', this.state.chapter);
    },

    /* --- Gameplay --- */
    loadLine: function() {
        const chData = scriptData[this.state.chapter];
        if(!chData || this.state.line >= chData.scenes.length) {
            this.finishChapter();
            return;
        }
        const scene = chData.scenes[this.state.line];
        if(scene.bg) this.dom.bg.className = scene.bg;
        this.renderCharacters(scene.chars || [], scene.focus);

        this.dom.text.innerText = '';
        this.dom.cursor.style.visibility = 'hidden';
        this.dom.speaker.style.display = scene.type === 'talk' ? 'inline-block' : 'none';
        if(scene.type === 'talk') this.dom.speaker.innerText = scene.name;

        if(scene.sound === 'holy') this.playTone('holy');
        
        this.state.typing = true;
        let charIdx = 0;
        if(this.state.timer) clearInterval(this.state.timer);
        this.state.timer = setInterval(() => {
            this.dom.text.innerText += scene.text[charIdx];
            if(charIdx % 2 === 0) this.playTone('type');
            charIdx++;
            if(charIdx >= scene.text.length) this.finishTyping();
        }, 50);
    },

    renderCharacters: function(chars, focus) {
        this.dom.stage.innerHTML = '';
        chars.forEach(id => {
            const wrap = document.createElement('div'); wrap.className = 'char-wrapper';
            if(focus && id !== focus) wrap.classList.add('char-dimmed');
            else if(focus && id === focus) wrap.classList.add('char-active');
            
            const base = document.createElement('div'); base.className = 'char-base c-'+id;
            if(id==='jesus') base.appendChild(Object.assign(document.createElement('div'),{className:'halo'}));
            base.appendChild(Object.assign(document.createElement('div'),{className:'head'}));
            base.appendChild(Object.assign(document.createElement('div'),{className:'body'}));
            
            wrap.appendChild(base); this.dom.stage.appendChild(wrap);
        });
    },

    finishTyping: function() {
        clearInterval(this.state.timer); this.state.typing = false;
        const scene = scriptData[this.state.chapter].scenes[this.state.line];
        this.dom.text.innerText = scene.text;
        this.dom.cursor.style.visibility = 'visible';
        if(this.state.auto) {
            const delay = 1500 + (scene.text.length * 80);
            this.state.timer = setTimeout(() => this.nextLine(), delay);
        }
    },

    nextLine: function() {
        if(this.state.typing) { this.finishTyping(); return; }
        if(this.state.line < scriptData[this.state.chapter].scenes.length - 1) {
            this.state.line++; this.playTone('next'); this.loadLine();
        } else { this.finishChapter(); }
    },

    prevLine: function() {
        if(this.state.line > 0) {
            this.state.line--; this.playTone('next'); this.loadLine();
        } else {
            this.showModal("這是本章的開始。", "alert");
        }
    },

    finishChapter: function() {
        this.stopAuto();
        if(this.state.chapter < 16) {
            this.showModal("本章結束。要進入下一章嗎？", "confirm", () => {
                this.showTitleScreen(this.state.chapter + 1);
            });
        } else {
            this.showModal("全書完。願主賜福。", "alert", () => this.renderMenu());
        }
    },

    toggleAuto: function() {
        this.state.auto = !this.state.auto;
        this.dom.btnAuto.innerText = this.state.auto ? "自動播放 ⏸" : "自動播放 ▶";
        this.dom.btnAuto.classList.toggle('active', this.state.auto);
        if(this.state.auto && !this.state.typing) this.nextLine();
        else clearTimeout(this.state.timer);
    },

    stopAuto: function() {
        this.state.auto = false;
        this.dom.btnAuto.innerText = "自動播放 ▶";
        this.dom.btnAuto.classList.remove('active');
        clearTimeout(this.state.timer);
    }
};

window.onload = () => Game.init();
document.addEventListener('keydown', (e) => {
    if(document.getElementById('menu-screen').style.display !== 'none') return;
    if(document.getElementById('rpg-modal').style.display === 'flex') return;
    if(e.code === 'Space' || e.code === 'Enter') Game.nextLine();
    if(e.code === 'Backspace') Game.prevLine();
});
</script>
